name: Actualizar calendario

on:
  schedule:
    - cron: '17 6 * * *' # cada día a las 7:17 en Madrid (horario de invierno)
  workflow_dispatch: # permite lanzarla a mano desde GitHub

permissions:
  contents: write

concurrency:
  group: actualizar-calendario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar novedades y actualizar datos
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node scripts/actualizar-lanzamientos.mjs

      - name: Guardar cambios (Cloudflare Pages vuelve a publicar la web)
        run: |
          git config user.name "botin-friki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/lanzamientos.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualización diaria del calendario"
            git push
          fi
